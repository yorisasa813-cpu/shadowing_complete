<style>

<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toLocaleDateString('sv-SE');

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2800);
}

// ================================================================ settings
const DEFAULTS = {
  rate: 0.95, audioRate: 1.0, enVoice: '', enVoice2: '', jaVoice: '',
  repeatFactor: 1.3, jaenFactor: 1.6, repeatShowEn: false, jaSpeak: true, announce: true, beep: true,
  goalMin: 15, newPerDay: 1,
  // 練習の流れ(型)。steps は順番どおりのステップと回数
  flows: [
    { id: 'full', name: 'じっくり(フルコース)', steps: [{ id: 'listen', n: 1 }, { id: 'read', n: 1 }, { id: 'overlap', n: 1 }, { id: 'shadow', n: 2 }, { id: 'repeat', n: 1 }, { id: 'jaen', n: 1 }] },
    { id: 'review', name: 'さっと復習', steps: [{ id: 'overlap', n: 1 }, { id: 'shadow', n: 1 }, { id: 'jaen', n: 1 }] },
    { id: 'shadow', name: 'シャドーイング集中', steps: [{ id: 'listen', n: 1 }, { id: 'shadow', n: 3 }] },
  ],
  flowNew: 'full', flowReview: 'review', // 新しいレッスン / 復習で使う型
};
let S = loadSettings();
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('sc.settings') || '{}');
    if (!s.flows && (s.course || s.review)) { // 以前の「フルコース」「復習コース」の回数設定を型に移す
      const order = ['listen', 'read', 'overlap', 'shadow', 'repeat', 'jaen'];
      const toSteps = c => order.filter(id => c?.[id] > 0).map(id => ({ id, n: c[id] }));
      s.flows = structuredClone(DEFAULTS.flows);
      if (s.course) s.flows[0].steps = toSteps(s.course);
      if (s.review) s.flows[1].steps = toSteps(s.review);
    }
    delete s.course; delete s.review;
    for (const f of s.flows || []) { // ['shadow', 'shadow'] の形(前の版)を [{ id, n }] にまとめる
      if (!f.steps.some(st => typeof st === 'string')) continue;
      const out = [];
      for (const id of f.steps) { const last = out.at(-1); if (last?.id === id) last.n++; else out.push({ id, n: 1 }); }
      f.steps = out;
    }
    return { ...structuredClone(DEFAULTS), ...s };
  } catch { return structuredClone(DEFAULTS); }
}
function saveSettings() { try { localStorage.setItem('sc.settings', JSON.stringify(S)); } catch {} }

// ================================================================ storage (この端末の IndexedDB に保存)
const idb = {
  db: null,
  open() {
    return this.db || (this.db = new Promise((res, rej) => {
      const r = indexedDB.open('shadowing-coach', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode), req = fn(t.objectStore('kv'));
      t.oncomplete = () => res(req?.result);
      t.onerror = t.onabort = () => rej(t.error);
    });
  },
  get(k) { return this.tx('readonly', s => s.get(k)); },
  set(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); },
};

const Store = {
  lessons: [], ok: true,
  async load() {
    try {
      this.lessons = (await idb.get('lessons') || []).filter(l => l.id !== 'sample'); // 初期のサンプルは片付ける
      navigator.storage?.persist?.().catch(() => {});
    } catch (e) { console.error(e); this.ok = false; }
  },
  async save() {
    try { await idb.set('lessons', this.lessons); }
    catch (e) { console.error(e); toast('この端末に保存できませんでした(プライベートブラウズでは保存できません)'); }
  },
  get(id) { return this.lessons.find(l => l.id === id); },
};

// ================================================================ 続ける記録と復習スケジュール(忘却曲線)
const INTERVALS = [1, 3, 7, 14, 30, 60, 120]; // 復習の間隔(日)。エビングハウスの忘却曲線に沿って間隔を広げる
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + n); return t.toLocaleDateString('sv-SE'); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);

const Stats = {
  days: {}, // 'YYYY-MM-DD' → { sec: 練習した秒数, runs: 最後までやった回数 }
  async load() { try { this.days = (await idb.get('stats'))?.days || {}; } catch {} },
  save() { return idb.set('stats', { days: this.days }).catch(() => {}); },
  // info.modes: { 項目: 秒 }(リスニング・シャドーイングなど) / info.lesson: レッスンID。今日の目標をちょうど達成したら true
  add(sec, completed, info = {}) {
    const d = today(), rec = this.days[d] || (this.days[d] = { sec: 0, runs: 0 });
    const before = rec.sec, goal = S.goalMin * 60;
    rec.sec += Math.round(sec);
    if (completed) rec.runs++;
    for (const [k, v] of Object.entries(info.modes || {})) if (v >= 1) { rec.modes ||= {}; rec.modes[k] = (rec.modes[k] || 0) + Math.round(v); }
    if (info.lesson && sec >= 1) { rec.lessons ||= {}; rec.lessons[info.lesson] = (rec.lessons[info.lesson] || 0) + Math.round(sec); }
    this.save();
    return before < goal && rec.sec >= goal;
  },
  streak() { // 練習した日の連続日数。今日がまだでも、昨日まで続いていれば途切れない
    let d = today(), n = 0;
    if (!this.days[d]?.runs) d = addDays(d, -1);
    while (this.days[d]?.runs) { n++; d = addDays(d, -1); }
    return n;
  },
  todaySec() { return this.days[today()]?.sec || 0; },
};

// 練習後の自己評価で次の復習日を決める: again=明日からやり直し / ok=同じ間隔 / good=次の間隔へ
// 練習を終えるたびに次の間隔へ進む(初回は1日後)。「難しかった」なら明日からやり直し
const nextStage = (L, grade) => grade === 'again' ? 0 : Math.min(L.srs ? L.srs.stage + 1 : 0, INTERVALS.length - 1);
function rateLesson(L, grade) {
  const srs = L.srs || { stage: -1, reps: 0, lapses: 0, first: today() };
  if (grade === 'again' && srs.reps) srs.lapses++;
  srs.stage = nextStage(L, grade);
  srs.reps++; srs.last = today();
  (L.rates ||= []).push({ d: today(), g: grade }); // 記録画面で「その日に学習したレッスン」を出すため
  srs.due = addDays(srs.last, INTERVALS[srs.stage]);
  L.srs = srs;
}
// 記憶の目安(%): 前回からの経過日数を間隔と比べ、指数関数の忘却曲線で見積もる。復習日ちょうどで約80%
function retention(L) {
  if (!L.srs?.last) return null;
  return Math.round(100 * Math.exp(Math.log(0.8) * daysBetween(L.srs.last, today()) / INTERVALS[L.srs.stage]));
}
const isDue = L => !!L.srs?.due && L.srs.due <= today();
function fmtDue(d) {
  const n = daysBetween(today(), d);
  return n < 0 ? `${-n}日遅れ` : n === 0 ? '今日' : n === 1 ? '明日' : `${+d.slice(5, 7)}/${+d.slice(8)}(あと${n}日)`;
}
function todayPlan() {
  const ls = Store.lessons.filter(l => l.sentences.length);
  const reviews = ls.filter(isDue).sort((a, b) => a.srs.due.localeCompare(b.srs.due));
  const startedToday = ls.filter(l => l.srs?.first === today()).length;
  const fresh = ls.filter(l => !l.srs).sort(byDate).slice(0, Math.max(0, S.newPerDay - startedToday));
  return { reviews, fresh };
}

// ================================================================ script parser
// 英文の行と日本語の行を見分けて、英文 → 訳 の組にする
const JA_RE = /[぀-ヿ㐀-鿿ｦ-ﾟ]/;
const SPEAKER_RE = /^([A-Z][A-Za-z.'\- ]{0,18}?)\s*[:：]\s*(.+)$/;
const HEADING_RE = /^[【\[［(（〈《]?\s*(日本語訳|和訳|全訳|対訳|訳|英文|本文|スクリプト|ダイアログ|ダイアローグ|スキット|会話|会話文|今日の表現|ポイント|解説|語句|単語|Dialogue|Script|Translation)\s*[】\]］)）〉》]?\s*[:：]?$/i;
const PREFIX_RE = /^(?:[■□●○◆◇★☆▶▷►・*>\-–—]+\s*|\(?\d{1,3}[.)）]\s+)/;

function classify(line) {
  if (JA_RE.test(line)) return 'ja';
  const compact = line.replace(/\s/g, '');
  const letters = (line.match(/[A-Za-z]/g) || []).length;
  if (letters >= 2 && letters / compact.length >= 0.6) {
    if (line.split(/\s+/).length >= 2 || /[.!?]$/.test(line)) return 'en';
  }
  return 'other';
}

// 「DIALOGUE」などの見出しがあれば、その節(次の見出しまで)だけを使う
const SECTION_START = /^(DIALOGUE|DIALOG|Dialogue|Dialog|ダイアログ|ダイアローグ|スキット|Skit)(\s|$|[:：])/;
const DECOR_RE = /[☆★■□●○◆◇]/g;
const isHeadLine = l => (/^[☆★■◆●【\[［]/.test(l) && l.length <= 40) || /^[A-Z][A-Z0-9 &'’\-]{3,}$/.test(l);
// 「Dialogue」の節が複数あるとき(英文だけの節と訳付きの節など)は、訳が多く付く節を選ぶ
function dialogueSection(rawLines) {
  let best = null, bestScore = 0;
  rawLines.forEach((l, i) => {
    if (!isHeadLine(l) || !SECTION_START.test(l.replace(DECOR_RE, '').trim())) return;
    let j = i + 1;
    while (j < rawLines.length && !isHeadLine(rawLines[j])) j++;
    const sec = rawLines.slice(i + 1, j), items = parseLines(sec);
    const score = items.length + 2 * items.filter(x => x.ja).length;
    if (items.length && score > bestScore) { best = sec; best.start = i + 1; best.end = j; bestScore = score; }
  });
  return best;
}
const splitRaw = text => String(text).split(/\r?\n/).map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
const hasDialogue = text => !!dialogueSection(splitRaw(text));

// 取り込み用ブックマークレットが付ける見出し
const CLIP_HEAD = '【Shadowing取り込み】';
// まとめて取得したときは記事ごとに「=====」の行で区切られている
function parseClips(text) {
  text = String(text || '');
  if (!text.startsWith(CLIP_HEAD)) return [{ title: '', url: '', raw: text }];
  return text.slice(text.indexOf('\n') + 1).split('\n=====\n').map(chunk => {
    const [head, ...rest] = chunk.split('\n---\n');
    const get = k => (head.match(new RegExp('^' + k + ': (.*)$', 'm')) || [])[1] || '';
    return { title: get('タイトル').split(/[｜|]/)[0].trim(), url: get('URL'), raw: rest.join('\n---\n') };
  });
}
const parseClip = text => parseClips(text)[0];
const dateFromTitle = t => { const m = String(t).match(/(\d{4})年(\d{1,2})月(\d{1,2})日/); return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : ''; };

function parseScript(text) {
  const raw = splitRaw(text);
  const sec = dialogueSection(raw);
  const items = parseLines(sec || raw);
  if (sec) fillTranslations(items, raw, sec.start, sec.end);
  return items;
}

// 訳のない会話文について、ページ内の別の場所(WORDS AND PHRASES など)にある
// 「英文 → 次の行に日本語訳」の組を探して付ける。1つの発言が複数の文に分けて訳されていてもつなげる。
// 書き起こしの揺れ(there is / there's など)があっても合うよう、単語単位であいまいに照合する
const enWords = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9' ]/g, ' ').split(/\s+/).filter(Boolean);
function lcsLen(a, b) {
  const dp = new Array(b.length + 1).fill(0);
  for (let i = 1; i <= a.length; i++) {
    let prev = 0;
    for (let j = 1; j <= b.length; j++) {
      const tmp = dp[j];
      dp[j] = a[i - 1] === b[j - 1] ? prev + 1 : Math.max(dp[j], dp[j - 1]);
      prev = tmp;
    }
  }
  return dp[b.length];
}
function fillTranslations(items, raw, start, end) {
  if (items.every(x => x.ja)) return;
  const pairs = []; // 会話の節より後ろにあるものを優先。会話の節そのものは見ない
  const seen = new Set();
  for (const i of [...raw.keys()].slice(end).concat([...raw.keys()].slice(0, start))) {
    const en = raw[i].replace(PREFIX_RE, ''), ja = raw[i + 1];
    if (!ja || classify(en) !== 'en' || classify(ja) !== 'ja' || /^[(（]?NOTE/i.test(ja)) continue;
    const w = enWords(en.replace(SPEAKER_RE, '$2')), key = w.join(' ');
    if (w.length >= 2 && !seen.has(key)) { seen.add(key); pairs.push({ w, ja: ja.replace(PREFIX_RE, '') }); }
  }
  for (const it of items) {
    if (it.ja) continue;
    const T = enWords(it.en), n = T.length, found = [];
    for (const c of pairs) {
      const m = c.w.length;
      if (m < 4 && m < n) continue; // 短い語句は語注のことが多いので、発言全体と一致するときだけ使う
      let best = null;
      for (let p = 0; p < n; p++) {
        for (let w = Math.max(1, m - 2); w <= m + 2 && p + w <= n; w++) {
          const sc = lcsLen(c.w, T.slice(p, p + w));
          if (sc >= 0.8 * m && sc >= 0.8 * w && (!best || sc > best.sc || (sc === best.sc && Math.abs(w - m) < Math.abs(best.w - m)))) best = { p, w, sc };
        }
      }
      if (best) found.push({ p: best.p, e: best.p + best.w, ja: c.ja });
    }
    found.sort((a, b) => a.p - b.p || b.e - a.e);
    const parts = [];
    let pos = 0, covered = 0;
    for (const f of found) if (f.p >= pos) { parts.push(f.ja); covered += f.e - f.p; pos = f.e; }
    if (n && covered >= n * 0.8) it.ja = parts.join('');
  }
}

function parseLines(rawLines) {
  const lines = rawLines.filter(l => !/^\*\*/.test(l)) // **語句 のような語注は除く
    .map(l => l.replace(PREFIX_RE, '')).filter(l => l && !HEADING_RE.test(l));
  // 話者ラベル付きの会話なら、ラベルのない英文は「直前の発言の続き」以外は語注とみなして除く
  const labeled = lines.filter(l => classify(l) === 'en' && SPEAKER_RE.test(l)).length >= 2;
  const runs = [];
  let prevEn = false;
  for (const line of lines) {
    const t = classify(line);
    if (t === 'other') continue;
    if (t === 'en' && labeled && !SPEAKER_RE.test(line) && !(prevEn && line.split(/\s+/).length >= 4)) continue;
    prevEn = t === 'en';
    const last = runs.at(-1);
    if (last && last.t === t) last.lines.push(line); else runs.push({ t, lines: [line] });
  }
  const items = [];
  runs.forEach((r, k) => {
    if (r.t !== 'en') return;
    const start = items.length;
    for (const line of r.lines) {
      const m = line.match(SPEAKER_RE);
      items.push(m ? { speaker: m[1].trim(), en: m[2].trim(), ja: '' } : { speaker: '', en: line, ja: '' });
    }
    // 英→訳 が1行ずつ交互のときか、英文のまとまりのあとに同じくらいの数の訳が続くときだけ組にする
    // (図のキャプションや解説の1行を訳と取り違えないように)
    const next = runs[k + 1], n = r.lines.length;
    if (!next || next.t !== 'ja' || !(n === 1 || next.lines.length >= Math.ceil(n * 0.6))) return;
    for (let q = 0; q < Math.min(n, next.lines.length); q++) items[start + q].ja = next.lines[q].replace(/^[^\s:：「『(（]{1,8}[:：]\s*/, '');
  });
  return items;
}

// ================================================================ speech
let voices = [];
const loadVoices = () => { voices = speechSynthesis.getVoices(); };
loadVoices();
speechSynthesis.addEventListener?.('voiceschanged', () => { loadVoices(); if (view.name === 'settings') render(); });

const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Grandma|Grandpa|Rocko|Eddy|Flo\b|Reed|Sandy|Shelley|Junior|Ralph|Fred|Kathy/i;
// 日本語環境の Mac では英語の効果音系ボイスが「ささやき声」「ベル」など日本語名になる
const isEn = v => /^en[-_]/i.test(v.lang) && !JA_RE.test(v.name);
const isJa = v => /^ja/i.test(v.lang);
const byName = n => (n ? voices.find(v => v.name === n) : null);
function best(filter, exclude) {
  const score = v => (/premium|enhanced|neural|natural|siri/i.test(v.name) ? 4 : 0) + (/^en[-_]US/i.test(v.lang) ? 2 : 0)
    + (/Samantha|Google US|Aria|Jenny|Ava|Zoe|Kyoko|Google 日本語|Nanami/i.test(v.name) ? 1 : 0);
  return voices.filter(v => filter(v) && !NOVELTY.test(v.name) && v.name !== exclude).sort((a, b) => score(b) - score(a))[0] || null;
}
const enPrimary = () => byName(S.enVoice) || best(isEn);
const enSecondary = () => { const p = enPrimary(); return byName(S.enVoice2) || best(isEn, p?.name) || p; };
const jaVoice = () => byName(S.jaVoice) || best(isJa);
function voiceFor(L, s) {
  const speakers = [...new Set(L.sentences.map(x => x.speaker).filter(Boolean))];
  return speakers.indexOf(s.speaker) % 2 === 1 ? enSecondary() : enPrimary();
}

let finishSpeech = null;
let keepUtter = null; // Safari で読み上げ途中に GC されないよう保持
function speakOnce(text, voice, lang, rate) {
  return new Promise(resolve => {
    const u = new SpeechSynthesisUtterance(text);
    if (voice) u.voice = voice;
    u.lang = (voice?.lang || lang).replace('_', '-');
    u.rate = rate;
    const t0 = performance.now();
    let done = false;
    const fin = ok => { if (done) return; done = true; clearTimeout(guard); if (finishSpeech === fin) finishSpeech = null; resolve({ ok, ms: performance.now() - t0 }); };
    const guard = setTimeout(() => fin(true), 5000 + text.length * 180 / rate); // onend が来ない環境の保険
    u.onend = () => fin(true);
    u.onerror = () => fin(false);
    finishSpeech = fin; keepUtter = u;
    speechSynthesis.resume();
    speechSynthesis.speak(u);
  });
}

// ---------------------------------------------------------------- 番組音声(MP3 など)
const audioEl = new Audio();
audioEl.preload = 'auto';
audioEl.preservesPitch = audioEl.webkitPreservesPitch = true;
let primeP = Promise.resolve();

const hasAudio = L => !!L?.audio && !L.audio.missing;
const segOf = (L, s) => (hasAudio(L) && s.seg && s.seg.e > s.seg.s ? s.seg : null);

// 音声ファイルは IndexedDB に Blob で保存し、再生時は blob: URL を使う
const audioUrls = new Map();
async function loadAudioUrl(L) {
  if (!hasAudio(L) || audioUrls.has(L.id)) return audioUrls.get(L?.id);
  const rec = await idb.get('audio:' + L.id).catch(() => null);
  if (!rec) { L.audio.missing = true; return null; }
  const u = URL.createObjectURL(rec.blob);
  audioUrls.set(L.id, u);
  return u;
}
async function ensureAudio(L) { // このレッスンの音声を再生できる状態にする。できなければ false(読み上げで代用)
  if (!hasAudio(L)) return false;
  if (!audioUrls.has(L.id)) await loadAudioUrl(L);
  return prepareAudio(L);
}
function forgetAudioUrl(id) { const u = audioUrls.get(id); if (u) { URL.revokeObjectURL(u); audioUrls.delete(id); } }
function prepareAudio(L) { // タップ操作の中から同期的に呼ぶ(iOS の再生制限のため)
  const u = hasAudio(L) && audioUrls.get(L.id);
  if (u && audioEl.dataset.u !== u) { audioEl.src = u; audioEl.dataset.u = u; audioEl.load(); }
  return !!u;
}

// 10ms ごとの音量(0〜100)を計算する。文の区切り(無音)を見つけるのに使う
async function computeEnvelope(arrayBuffer) {
  const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  let ctx;
  try { ctx = new Ctx(1, 1, 8000); } catch { ctx = new Ctx(1, 1, 44100); } // 低いサンプルレートで展開してメモリを節約
  const ab = await new Promise((res, rej) => { const p = ctx.decodeAudioData(arrayBuffer, res, rej); p?.catch?.(rej); });
  const ch = ab.getChannelData(0), hop = Math.round(ab.sampleRate / 100), n = Math.floor(ch.length / hop);
  const data = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    let sum = 0;
    for (let k = i * hop, e = k + hop; k < e; k++) sum += ch[k] * ch[k];
    const db = 10 * Math.log10(sum / hop + 1e-10);
    data[i] = Math.max(0, Math.min(100, Math.round((db + 70) * 100 / 70)));
  }
  return { step: hop / ab.sampleRate, duration: ab.duration, data };
}

// 音声ファイルをレッスンに取り付ける。長さが前と同じなら区切りはそのまま使う
async function attachAudio(L, file) {
  const env = await computeEnvelope(await file.arrayBuffer());
  await idb.set('audio:' + L.id, { blob: file, name: file.name });
  await idb.set('env:' + L.id, env);
  forgetAudioUrl(L.id);
  const same = L.audio?.duration && Math.abs(L.audio.duration - env.duration) < 0.3;
  if (!same) L.sentences.forEach(s => delete s.seg);
  L.audio = { name: file.name, duration: env.duration, v: Date.now() };
  return env;
}
async function removeAudio(L) {
  forgetAudioUrl(L.id);
  await idb.del('audio:' + L.id).catch(() => {});
  await idb.del('env:' + L.id).catch(() => {});
  delete L.audio; L.sentences.forEach(s => delete s.seg);
}

// まだ区切っていないレッスンを、音声ファイル全体を会話として自動で区切る
async function autoSplitIfNeeded(L) {
  if (!hasAudio(L) || !L.sentences.length || L.sentences.some(s => s.seg)) return false;
  const env = await idb.get('env:' + L.id).catch(() => null);
  if (!env) return false;
  const segs = computeSplit(env, L.sentences, 0, env.duration);
  if (typeof segs === 'string') return false;
  L.sentences.forEach((s, i) => { s.seg = segs[i]; });
  return true;
}

// 区間 [seg.s, seg.e] (秒) を再生する。speakOnce と同じく finishSpeech で中断できる
function playSeg(seg, rate) {
  return new Promise(resolve => {
    let done = false, timer = null, guard = null;
    const t0 = performance.now();
    const fin = ok => {
      if (done) return; done = true;
      clearInterval(timer); clearTimeout(guard); audioEl.removeEventListener('seeked', go);
      audioEl.pause();
      if (finishSpeech === fin) finishSpeech = null;
      resolve({ ok, ms: performance.now() - t0 });
    };
    function go() {
      audioEl.removeEventListener('seeked', go);
      if (done || timer) return;
      audioEl.playbackRate = rate;
      audioEl.play().catch(() => fin(false));
      timer = setInterval(() => { if (audioEl.currentTime >= seg.e || audioEl.ended) fin(true); }, 15);
      guard = setTimeout(() => fin(true), (seg.e - seg.s) / rate * 1000 + 4000);
    }
    finishSpeech = fin;
    primeP.then(() => {
      if (done) return;
      audioEl.addEventListener('seeked', go);
      setTimeout(go, 1500); // seeked が来ない環境の保険
      audioEl.currentTime = seg.s;
    });
  });
}

let actx = null, unlocked = false;
function unlock() { // iOS: 最初の音声はタップ操作の中で鳴らす必要がある
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch {}
  if (!unlocked) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch {} unlocked = true; }
  if (audioEl.src && audioEl.paused) {
    audioEl.muted = true;
    primeP = audioEl.play().then(() => audioEl.pause()).catch(() => {}).finally(() => { audioEl.muted = false; });
  }
}
function beep() {
  if (!S.beep || !actx) return;
  try {
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.17);
  } catch {}
}
let wakeLock = null;
async function keepAwake(on) {
  try { if (on) wakeLock = await navigator.wakeLock?.request('screen'); else { await wakeLock?.release(); wakeLock = null; } } catch {}
}

// ================================================================ 練習のステップ(型を組み立てる部品)
// en / ja: そのステップで英文・訳を最初に表示するか(null は設定に従う) / gap: 文と文の間(ms)
// repeat: 1文ごとに言う時間をとる / jaen: 訳を見て言ってから正解を聞く
const STEPS = [
  { id: 'listen', short: '聞く', name: '通し聞き', desc: '英文を見ずに、まず全体を聞き取る', en: false, ja: false, gap: 450 },

// ================================================================ 記録画面(月のカレンダー・累計グラフ)
const fmtMin = sec => { const m = Math.round(sec / 60); return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}` : `${m}分`; };
const GRADE_EMOJI = { again: '😣', ok: '🙂', good: '😄', done: '✅' };
const ITEM_NAMES = { listen: 'リスニング(通し聞き)', read: '英文を見ながら聞く', overlap: 'オーバーラッピング', shadow: 'シャドーイング', repeat: 'リピーティング', jaen: '日→英', other: '内訳なし' };
// 期間内の項目別・レッスン別の秒数
function breakdown(dayKeys) {
  const items = {}, lessons = {};
  for (const d of dayKeys) {
    const r = Stats.days[d];
    if (!r) continue;
    let known = 0;
    for (const [k, v] of Object.entries(r.modes || {})) { items[k] = (items[k] || 0) + v; known += v; }
    if (r.sec - known >= 30) items.other = (items.other || 0) + r.sec - known;
    for (const [id, v] of Object.entries(r.lessons || {})) lessons[id] = (lessons[id] || 0) + v;
  }
  return { items, lessons };
}
function barList(entries, total, label) { // 横棒の一覧(1色・長さで量を表す)
  const max = Math.max(1, ...entries.map(e => e[1]));
  return entries.map(([k, v]) => `<div class="brow">${label(k)}<div class="btrack"><i style="width:${Math.max(2, v / max * 100)}%"></i></div><span class="bval">${fmtMin(v)}<small>${total ? Math.round(v / total * 100) + '%' : ''}</small></span></div>`).join('');
}
let barGeo = null; // 日ごとの棒グラフの座標(ホバー用)
function dailyBars(month, nDays) {
  const W = 640, H = 170, L = 40, Rp = 8, T = 12, B = 22, iw = W - L - Rp, ih = H - T - B, g = S.goalMin;
  const days = Array.from({ length: nDays }, (_, k) => `${month}-${String(k + 1).padStart(2, '0')}`);
  const mins = days.map(d => (Stats.days[d]?.sec || 0) / 60);
  const top = Math.max(g * 1.25, ...mins) * 1.05, Y = v => T + ih - v / top * ih, bw = iw / nDays;
  let bars = '';
  mins.forEach((v, k) => { if (v >= 0.5) bars += `<rect class="c-bar" x="${(L + k * bw + 1).toFixed(1)}" y="${Y(v).toFixed(1)}" width="${Math.max(2, bw - 2).toFixed(1)}" height="${(T + ih - Y(v)).toFixed(1)}" rx="2"/>`; });
  barGeo = { days, mins, L, bw, W, T, ih, Y };
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" id="dchart" role="img" aria-label="${+month.slice(5)}月の日ごとの練習時間">
    <line class="c-grid" x1="${L}" x2="${W - Rp}" y1="${T + ih}" y2="${T + ih}"/>
    <line class="c-goal" x1="${L}" x2="${W - Rp}" y1="${Y(g)}" y2="${Y(g)}"/><text class="c-lab" x="${L - 6}" y="${Y(g) + 4}" text-anchor="end">${g}分</text>
    ${bars}
    ${[1, 10, 20, nDays].map(k => `<text class="c-lab" x="${L + (k - 0.5) * bw}" y="${H - 6}" text-anchor="middle">${k}</text>`).join('')}
    <rect id="dhl" class="c-hl" x="-20" y="${T}" width="${bw}" height="${ih}"/>
    <rect x="${L}" y="0" width="${iw}" height="${H}" fill="transparent"/>
  </svg><div class="ctip" id="dtip"></div></div>`;
}
function attachBars() {
  const svg = $('#dchart'), tip = $('#dtip');
  if (!svg || !barGeo) return;
  const { days, L, bw, W } = barGeo;
  const show = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * W, k = Math.max(0, Math.min(days.length - 1, Math.floor((sx - L) / bw)));
    const rec = Stats.days[days[k]], parts = Object.entries(rec?.modes || {}).sort((a, b) => b[1] - a[1]).map(([m, v]) => `${(ITEM_NAMES[m] || m).replace(/\(.*\)/, '')} ${fmtMin(v)}`);
    $('#dhl').setAttribute('x', L + k * bw);
    tip.textContent = `${+days[k].slice(5, 7)}/${+days[k].slice(8)} ${fmtMin(rec?.sec || 0)}${parts.length ? ' · ' + parts.join(' · ') : ''}`;
    tip.style.display = 'block';
    placeTip(tip, (L + (k + 0.5) * bw) / W * r.width, r.width);
  };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; $('#dhl').setAttribute('x', -20); });
}
function bestStreak() {
  let best = 0, cur = 0, prev = null;
  for (const d of Object.keys(Stats.days).filter(d => Stats.days[d].runs).sort()) {
    cur = prev && daysBetween(prev, d) === 1 ? cur + 1 : 1;
    best = Math.max(best, cur); prev = d;
  }
  return best;
}
const lessonsOn = d => Store.lessons.flatMap(l => (l.rates || []).filter(r => r.d === d).map(r => ({ l, g: r.g })));

let chartGeo = null; // 累計グラフの座標(ホバー用)
function cumulativeChart() {
  const days = Object.keys(Stats.days).filter(d => Stats.days[d].sec > 0).sort();
  if (!days.length) { chartGeo = null; return '<p class="hint">練習すると、ここに練習時間の積み上げが表示されます。</p>'; }
  const start = days[0], n = daysBetween(start, today()) + 1, pts = [];
  let acc = 0;
  for (let k = 0; k < n; k++) { const d = addDays(start, k), sec = Stats.days[d]?.sec || 0; acc += sec; pts.push({ d, sec, acc }); }
  const W = 640, H = 210, L = 56, Rp = 14, T = 14, B = 28, iw = W - L - Rp, ih = H - T - B;
  const maxMin = Math.max(10, acc / 60);
  const step = [5, 10, 15, 30, 60, 120, 300, 600, 1200, 3000, 6000, 12000].find(x => x >= maxMin / 3) || 12000;
  const top = Math.ceil(maxMin / step) * step;
  const X = k => L + (n === 1 ? iw / 2 : k / (n - 1) * iw), Y = min => T + ih - min / top * ih;
  const line = pts.map((p, k) => `${k ? 'L' : 'M'}${X(k).toFixed(1)},${Y(p.acc / 60).toFixed(1)}`).join('');
  const area = `${line}L${X(n - 1).toFixed(1)},${T + ih}L${X(0).toFixed(1)},${T + ih}Z`;
  const lab = v => (v === 0 ? '0' : v < 60 ? v + '分' : (v / 60) + '時間');
  let grid = '';
  for (let v = 0; v <= top; v += step) grid += `<line class="c-grid" x1="${L}" x2="${W - Rp}" y1="${Y(v)}" y2="${Y(v)}"/><text class="c-lab" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${lab(v)}</text>`;
  const md = d => `${+d.slice(5, 7)}/${+d.slice(8)}`;
  chartGeo = { pts, X, Y, L, iw, n, W };
  return `<div class="chartbox" id="cbox">
    <svg viewBox="0 0 ${W} ${H}" id="cchart" role="img" aria-label="${md(start)}からの累計練習時間 ${fmtMin(acc)}">
      ${grid}
      <path class="c-area" d="${area}"/><path class="c-line" d="${line}"/>
      <text class="c-lab" x="${X(0)}" y="${H - 8}" text-anchor="${n === 1 ? 'middle' : 'start'}">${md(start)}</text>
      ${n > 1 ? `<text class="c-lab" x="${X(n - 1)}" y="${H - 8}" text-anchor="end">${md(pts[n - 1].d)}</text>` : ''}
      <line id="cx" class="c-x" y1="${T}" y2="${T + ih}" x1="-10" x2="-10"/>
      <circle id="cdot" class="c-dot" r="5" cx="-10" cy="-10"/>
      <rect x="${L - 10}" y="0" width="${iw + 20}" height="${H}" fill="transparent"/>
    </svg><div class="ctip" id="ctip"></div></div>`;
}
function placeTip(tip, x, width) { // 画面からはみ出さない位置に吹き出しを置く
  const half = tip.offsetWidth / 2;
  tip.style.left = Math.max(half, Math.min(width - half, x)) + 'px';
}
function attachChart() {
  const svg = $('#cchart'), tip = $('#ctip');
  if (!svg || !chartGeo) return;
  const { pts, X, Y, L, iw, n, W } = chartGeo;
  const show = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * W;
    const k = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round((sx - L) / iw * (n - 1)))), p = pts[k];
    $('#cx').setAttribute('x1', X(k)); $('#cx').setAttribute('x2', X(k));
    $('#cdot').setAttribute('cx', X(k)); $('#cdot').setAttribute('cy', Y(p.acc / 60));
    tip.textContent = `${+p.d.slice(5, 7)}/${+p.d.slice(8)} 累計 ${fmtMin(p.acc)}(この日 ${fmtMin(p.sec)})`;
    tip.style.display = 'block';
    placeTip(tip, X(k) / W * r.width, r.width);
  };
  const hide = () => { tip.style.display = 'none'; $('#cx').setAttribute('x1', -10); $('#cx').setAttribute('x2', -10); $('#cdot').setAttribute('cx', -10); };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', hide);
}

}
// ≡ をドラッグして並べ替え(指でもマウスでも)
function attachFlowDrag() {
  const list = $('#fsteps');
  if (!list) return;
  list.addEventListener('pointerdown', e => {
    const grip = e.target.closest('.grip');
    if (!grip) return;
    e.preventDefault();
    const li = grip.closest('li');
    li.classList.add('dragging');
    grip.setPointerCapture(e.pointerId);
    const move = ev => {
      const after = [...list.children].filter(x => x !== li).find(x => { const r = x.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
      if (after !== li.nextElementSibling) list.insertBefore(li, after || null);
    };
    const up = () => {
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
      const f = S.flows[view.fi], order = [...list.children].map(x => +x.dataset.si);
      f.steps = order.map(i => f.steps[i]);
      saveSettings(); render();
    };
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
  });
}

// ================================================================ 学習画面(ダイアログを見ながら、型の順番でステップが自動で進む)
const SPEEDS = [0.7, 0.8, 0.9, 1.0, 1.1];
const P = { token: 0, idx: 0, playing: false }; // 学習画面の再生状態

function stopStudy() {
  P.token++; P.playing = false;
  finishSpeech?.(false); speechSynthesis.cancel(); audioEl.pause();
  updateStudyBar();
}
function updateStudyBar() {
  const b = $('#splay'); if (b) b.textContent = P.playing ? '⏸ 停止' : (view.step || P.idx ? '▶ 続きから' : '▶ 始める');
  setStudyProg(0);
}
function setStudyProg(f) { const b = $('#sprog'); if (b) b.style.width = (Math.max(0, Math.min(1, f)) * 100).toFixed(1) + '%'; }
function markLine(i, scroll = true) {
  document.querySelectorAll('.sline.cur').forEach(e => e.classList.remove('cur'));
  const el = document.querySelector(`.sline[data-i="${i}"]`);
  if (el) { el.classList.add('cur'); if (scroll) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}
function revealLine(i, k) {
  view.rev?.[k]?.add(i);
  const el = document.querySelector(`.sline[data-i="${i}"] .${k}`);
  if (el) { el.classList.remove('hid'); el.removeAttribute('data-act'); }
}
const lineRate = (L, s) => (segOf(L, s) ? S.audioRate : S.rate) * view.speed;
const playLine = async (L, s) => {
  const seg = segOf(L, s);
  if (seg && await ensureAudio(L)) return playSeg(seg, lineRate(L, s));
  return speakOnce(s.en, voiceFor(L, s), 'en-US', S.rate * view.speed);
};
const estLine = (L, s) => { const seg = segOf(L, s); return seg ? (seg.e - seg.s) * 1000 / lineRate(L, s) : s.en.split(/\s+/).length * 400 / lineRate(L, s) + 300; };

// そのレッスンで流すステップの列(型を回数ぶん展開。訳がなければ日→英は省く)
function studyPlan(L) {
  const noJa = !L.sentences.some(s => s.ja), plan = [];
  for (const it of flowItems(S[flowKey(L)])) {
    if (noJa && it.id === 'jaen') continue;
    for (let k = 1; k <= it.n; k++) plan.push({ id: it.id, rep: k, of: it.n });
  }
  return plan;
}
function showFor(id) { const d = stepDef(id); return { en: d.en ?? S.repeatShowEn, ja: d.ja }; }
function setStep(k, plan) { Object.assign(view, { step: k, show: showFor(plan[k].id), rev: { en: new Set(), ja: new Set() } }); render(); }
const nextToday = L => { const { reviews, fresh } = todayPlan(); return [...reviews, ...fresh].find(l => l.id !== L.id); };

async function studyRun(fromStep = 0, fromLine = 0) {
  const L = Store.get(view.id);
  if (!L) return;
  const plan = studyPlan(L);
  if (!plan.length) return toast('この型にはステップがありません(✏️ から追加できます)');
  stopStudy();
  const tok = ++P.token, alive = () => P.token === tok;
  const pause = async (ms, bar) => { // 停止されたら抜ける
    for (let left = ms; left > 0; left -= 50) { await sleep(50); if (!alive()) throw 0; if (bar) setStudyProg(1 - left / ms); }
    setStudyProg(0);
  };
  let mark = Date.now(), cur = null; // 練習時間をステップごとに記録する
  const flush = () => {
    if (cur) { const sec = (Date.now() - mark) / 1000; if (Stats.add(sec, false, { lesson: L.id, modes: { [cur]: sec } })) toast('🏆 今日の目標を達成しました！'); }
    mark = Date.now();
  };
  P.playing = true; keepAwake(true);
  try {
    for (let k = fromStep; k < plan.length; k++) {
      const d = stepDef(plan[k].id);
      flush(); cur = d.id;
      if (fromLine === 0 || k !== view.step) setStep(k, plan); else updateStudyBar();
      if (S.announce && fromLine === 0) {
        await speakOnce(d.name + (plan[k].of > 1 ? `、${plan[k].rep}回目` : ''), jaVoice(), 'ja-JP', 1.1);
        if (!alive()) throw 0;
      }
      for (let i = fromLine; i < L.sentences.length; i++) {
        const s = L.sentences[i];
        if (d.jaen && !s.ja) continue;
        P.idx = i; markLine(i);
        if (d.jaen) {
          revealLine(i, 'ja');
          if (S.jaSpeak) { await speakOnce(s.ja, jaVoice(), 'ja-JP', 1.05); if (!alive()) throw 0; }
          beep();
          await pause(estLine(L, s) * S.jaenFactor + 1500, true); // 考える時間
          revealLine(i, 'en');
        }
        const r = await playLine(L, s);
        if (!alive()) throw 0;
        if (d.repeat) { beep(); await pause(r.ms * S.repeatFactor + 600, true); } // 言う時間
        else await pause(d.jaen ? 1200 : d.gap);
      }
      fromLine = 0;
    }
    flush(); cur = null;
    P.idx = 0; P.playing = false; view.step = 0;
    openSheet(true); // 最後まで終わったら、すぐ評価
  } catch {} finally {
    flush();
    if (alive()) { P.playing = false; updateStudyBar(); }
    keepAwake(false);
  }
}
let sheetTimer = null;
function openSheet(finished) {
  const L = Store.get(view.id), nx = nextToday(L);
  if (nx) loadAudioUrl(nx).catch(() => {}); // 次のレッスンをすぐ始められるように
  Object.assign(view, { sheet: true, finished }); render();
  clearInterval(sheetTimer);
  if (!finished) return;
  let left = 3; // 最後まで終わったときは、3秒後に自動で次へ
  sheetTimer = setInterval(() => {
    if (view.name !== 'lesson' || !view.sheet) return clearInterval(sheetTimer);
    if (--left > 0) { const c = $('#scount'); if (c) c.textContent = `${left}秒後に自動で進みます`; }
    else { clearInterval(sheetTimer); ACTS.sheetNext(); }
  }, 1000);
}

// ---- 無音の検出(env.data は 10ms ごとの音量 0〜100)
function analyze(env, t0, t1, ratio = 0.35, minSil = 0.15) {
  const st = env.step, d = env.data;
  const a = Math.max(0, Math.floor(t0 / st)), b = Math.min(d.length, Math.ceil(t1 / st));
  if (b - a < 10) return null;
  const vals = Array.from(d.slice(a, b)).sort((x, y) => x - y);
  const lo = vals[Math.floor(vals.length * 0.1)], hi = vals[Math.floor(vals.length * 0.9)];
  const thr = lo + (hi - lo) * ratio;
  const runs = [];
  let rs = null;
  for (let k = a; k <= b; k++) {
    const quiet = k < b && d[k] < thr;
    if (quiet && rs == null) rs = k;
    if (!quiet && rs != null) { if ((k - rs) * st >= minSil) runs.push({ a: rs * st, b: k * st }); rs = null; }
  }
  return { thr, runs };
}

// 区間 [t0, t1] を文の数で区切る。成功すれば [{s, e}, ...]、失敗ならエラーメッセージを返す
function computeSplit(env, sentences, t0, t1) {
  // 無音が見つかりにくい音声でも区切れるよう、しきい値をゆるめながら試す
  let err = '';
  for (const [ratio, minSil] of [[0.35, 0.15], [0.5, 0.1], [0.62, 0.06]]) {
    const r = splitWith(env, sentences, t0, t1, ratio, minSil);
    if (typeof r !== 'string') return r;
    err = r;
  }
  if (!(t1 - t0 >= 1)) return err;
  // それでも足りなければ、文の長さの比率で区切る(番組音声のまま流れる。ずれは「番組音声・区切り」で調整)
  const w = sentences.map(s => s.en.split(/\s+/).length + 1), W = w.reduce((a, b) => a + b, 0), r3 = x => Math.round(x * 1000) / 1000;
  let pos = t0;
  const segs = w.map(x => { const s = pos; pos += (t1 - t0) * x / W; return { s: r3(s), e: r3(pos) }; });
  segs.approx = true;
  return segs;
}
function splitWith(env, sentences, t0, t1, ratio, minSil) {
  const N = sentences.length;
  const A = analyze(env, t0, t1, ratio, minSil);
  if (!A) return '区間が短すぎます';
  let S0 = t0, E0 = t1;
  const r0 = A.runs.find(r => r.a <= S0 + 0.05 && r.b > S0); // 開始位置が無音の中なら、声の始まりまで進める
  if (r0) S0 = Math.max(S0, r0.b - 0.08);
  const r1 = [...A.runs].reverse().find(r => r.b >= E0 - 0.05 && r.a < E0);
  if (r1) E0 = Math.min(E0, r1.a + 0.1);
  if (N === 1) return [{ s: S0, e: E0 }];
  const cands = A.runs.filter(r => r.a > S0 + 0.3 && r.b < E0 - 0.3);
  if (cands.length < N - 1) return `文の切れ目(無音)が足りません(${cands.length}か所)。区間を見直すか、手動で区切ってください`;
  // 文の長さ(単語数)の比率に近く、かつ長い無音で切れる組み合わせを動的計画法で選ぶ
  const w = sentences.map(s => s.en.split(/\s+/).length + 1), W = w.reduce((a, b) => a + b, 0);
  const exp = w.map(x => (E0 - S0) * x / W);
  const cost = (i, a, b) => ((b - a - exp[i]) / Math.max(exp[i], 1)) ** 2;
  const bonus = r => 0.6 * Math.min(r.b - r.a, 1.2);
  const M = cands.length;
  const dp = Array.from({ length: N - 1 }, () => new Float64Array(M).fill(Infinity));
  const bk = Array.from({ length: N - 1 }, () => new Int32Array(M).fill(-1));
  for (let j = 0; j < M; j++) dp[0][j] = cost(0, S0, cands[j].a) - bonus(cands[j]);
  for (let i = 1; i < N - 1; i++) {
    for (let j = i; j < M; j++) {
      let best = Infinity, bj = -1;
      for (let k = i - 1; k < j; k++) {
        if (dp[i - 1][k] === Infinity) continue;
        const t = dp[i - 1][k] + cost(i, cands[k].b, cands[j].a);
        if (t < best) { best = t; bj = k; }
      }
      dp[i][j] = best - bonus(cands[j]); bk[i][j] = bj;
    }
  }
  let bestJ = -1, best = Infinity;
  for (let j = N - 2; j < M; j++) {
    const t = dp[N - 2][j] + cost(N - 1, cands[j].b, E0);
    if (t < best) { best = t; bestJ = j; }
  }
  const cuts = [];
  for (let i = N - 2, j = bestJ; i >= 0; j = bk[i][j], i--) cuts.unshift(cands[j]);
  const r3 = x => Math.round(x * 1000) / 1000;
  return sentences.map((_, i) => ({ s: r3(i ? cuts[i - 1].b - 0.08 : S0), e: r3(i < N - 1 ? cuts[i].a + 0.08 : E0) }));
}

function autoSplit() {
  const v = view, L = Store.get(v.id);
  if (!v.env) return toast('音量データがないため自動では区切れません。手動で区切ってください');
  if (v.dlgS == null || v.dlgE == null || v.dlgE - v.dlgS < 1) return toast('先に「会話の開始」と「会話の終わり」の位置を登録してください');
  const segs = computeSplit(v.env, L.sentences, v.dlgS, v.dlgE);
  if (typeof segs === 'string') return toast(segs);
  v.segs = segs; v.dirty = true; render();
  toast(segs.approx ? '文の切れ目が見つからなかったため、文の長さの比率で区切りました。▶ で確認して調整してください' : `${segs.length}文に区切りました。▶ で確認して、ずれていたら微調整してください`);
}

// 手動で区切った境界を、近くの無音に合わせる
function snapAll() {
  const v = view, segs = v.segs, idx = segs.map((g, i) => (g ? i : -1)).filter(i => i >= 0);
  if (!v.env || !idx.length) return;
  const A = analyze(v.env, segs[idx[0]].s - 3, segs[idx.at(-1)].e + 3);
  if (!A) return;
  const near = (t, maxd) => {
    let best = null, bd = maxd;
    for (const r of A.runs) {
      const d = t < r.a ? r.a - t : t > r.b ? t - r.b : -(r.b - r.a); // 中に入っていれば長い無音を優先
      if (d < bd) { bd = d; best = r; }
    }
    return best;
  };
  for (let k = 1; k < idx.length; k++) {
    const p = segs[idx[k - 1]], c = segs[idx[k]];
    const r = near((p.e + c.s) / 2, 0.6);
    if (r) { p.e = r.a + 0.08; c.s = Math.max(p.e, r.b - 0.08); }
  }
  const f = segs[idx[0]], l = segs[idx.at(-1)];
  const r0 = near(f.s, 0.5); if (r0 && r0.b - 0.08 < f.e) f.s = r0.b - 0.08;
  const r1 = near(l.e, 0.5); if (r1 && r1.a + 0.1 > l.s) l.e = r1.a + 0.1;
}

async function uploadAudio(file) {
  const L = Store.get(view.id);
  if (!file || !L) return;
  view.busy = true; render();
  try {
    await attachAudio(L, file);
    await Store.save();
    await openSegs(L.id);
    if (L.sentences.length && !view.segs.some(Boolean)) autoSplit(); // 全体を自動で区切っておく(ずれていれば調整)
    else toast('取り込みました');
  } catch (e) {
    console.error(e);
    toast('この音声ファイルは読み込めませんでした(MP3 / M4A / WAV を選んでください)');
    view.busy = false; render();
  }
}

// ---- 波形の描画
let segRAF = 0, zoomWin = [0, 12], frameNo = 0;
function sizeCanvas(c) {
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [ctx, w, h];
}
function drawWave(c, t0, t1, labels) {
  if (!c || t1 <= t0) return;
  const [ctx, W, H] = sizeCanvas(c), v = view, env = v.env;
  const cs = getComputedStyle(document.documentElement), col = k => cs.getPropertyValue(k).trim();
  const X = t => (t - t0) / (t1 - t0) * W;
  ctx.clearRect(0, 0, W, H);
  v.segs.forEach((g, i) => {
    if (!g || g.e < t0 || g.s > t1) return;
    ctx.globalAlpha = i % 2 ? 0.16 : 0.3; ctx.fillStyle = col('--accent');
    ctx.fillRect(X(g.s), 0, Math.max(1, X(g.e) - X(g.s)), H);
    ctx.globalAlpha = 1;
    if (labels) { ctx.fillStyle = col('--accent'); ctx.font = '600 11px system-ui'; ctx.fillText(String(i + 1), X(g.s) + 3, 12); }
  });
  if (env) {
    ctx.fillStyle = col('--sub');
    const st = env.step, d = env.data;
    for (let x = 0; x < W; x++) {
      const a = Math.floor((t0 + x / W * (t1 - t0)) / st), b = Math.max(a + 1, Math.floor((t0 + (x + 1) / W * (t1 - t0)) / st));
      let m = 0;
      for (let k = Math.max(0, a); k < b && k < d.length; k++) if (d[k] > m) m = d[k];
      const h = m / 100 * (H - 6);
      ctx.fillRect(x, (H - h) / 2, 1, Math.max(1, h));
    }
  }
  ctx.fillStyle = col('--ok');
  for (const t of [v.dlgS, v.dlgE]) if (t != null && t >= t0 && t <= t1) ctx.fillRect(X(t) - 1, 0, 2, H);
  ctx.fillStyle = col('--danger');
  ctx.fillRect(X(audioEl.currentTime) - 1, 0, 2, H);
}
function segLoop() {
  cancelAnimationFrame(segRAF);
  const tick = () => {
    if (view.name !== 'segs') return;
    const L = Store.get(view.id), dur = audioDur(L), ct = audioEl.currentTime;
    if (frameNo++ % 4 === 0) drawWave($('#wavAll'), 0, dur, false);
    const t0 = Math.max(0, Math.min(ct - 4, dur - 12));
    zoomWin = [t0, t0 + 12];
    drawWave($('#wavZoom'), zoomWin[0], zoomWin[1], true);
    const tn = $('#tNow'); if (tn) tn.textContent = `${fmtT(ct)} / ${fmtT(dur)}`;
    const pp = $('#ppBtn'); if (pp) pp.textContent = audioEl.paused ? '▶' : '⏸';
    segRAF = requestAnimationFrame(tick);
  };
  tick();
}
function stopEditorAudio() { finishSpeech?.(false); audioEl.pause(); }

document.addEventListener('click', e => {

  if (el && ACTS[el.dataset.act]) ACTS[el.dataset.act](el, e);
});

function onInput(e) {
  const el = e.target;
  if (el.dataset.file === 'upload') { if (e.type === 'change') uploadAudio(el.files[0]); return; }
  if (el.dataset.file === 'assign') { if (e.type === 'change' && el.files.length) startAssign(el.files); return; }
  if (el.dataset.assign !== undefined && view.name === 'assign') { view.pairs[+el.dataset.assign] = el.value; return; }
  if (el.dataset.file === 'restore') { if (e.type === 'change' && el.files[0]) restoreBackup(el.files[0]); return; }
  if (el.dataset.f && view.draft) { view.draft[el.dataset.f] = el.value; return; }
  if (el.dataset.r && view.draft) { view.draft.rows[+el.closest('.erow').dataset.i][el.dataset.r] = el.value; return; }
  if (el.dataset.s) {
    const k = el.dataset.s;
    S[k] = el.type === 'checkbox' ? el.checked : el.dataset.num !== undefined ? parseFloat(el.value) : el.value;
    const out = el.parentElement.querySelector('output');
    if (out) out.textContent = /rate/i.test(k) ? S[k].toFixed(2) + '×' : S[k].toFixed(1) + '倍';
    saveSettings(); return;
  }
  if (el.dataset.sn) { S[el.dataset.sn] = Math.max(+el.min, Math.min(+el.max, parseInt(el.value, 10) || 0)); saveSettings(); return; }
  if (el.dataset.flowsel) {
    if (e.type === 'change') { S[el.dataset.flowsel] = el.value; saveSettings(); if (view.name === 'lesson') { stopStudy(); view.step = 0; P.idx = 0; view.show = null; } render(); }
    return;
  }
  if (el.dataset.flowname) { S.flows[+el.dataset.flowname].name = el.value.trim() || '名前なし'; saveSettings(); return; }
}
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);

// Mac のキーボード操作: 学習画面は Space=再生/停止、区切り画面は Space=タップ/再生 ←→=移動
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  if (view.name === 'segs') { // 区切り画面: Space=タップ/再生 ←→=1秒移動(Shiftで5秒)
    const d = e.shiftKey ? 5 : 1;
    if (e.key === ' ') { e.preventDefault(); view.tap != null ? ACTS.tap() : ACTS.playPause(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); audioEl.currentTime = Math.max(0, audioEl.currentTime + (e.key === 'ArrowLeft' ? -d : d)); }
    return;
  }
  if (view.name === 'lesson' && e.key === ' ') { e.preventDefault(); return ACTS.studyPlay(); }
});

// ================================================================ クリップボードから取り込み
function handleClipText(text, targetId) {
  const target = targetId ? Store.get(targetId) : null;
  const clips = parseClips(text);
  if (clips.length > 1) return importBundle(clips);
  const c = clips[0];
  const rows = parseScript(c.raw);
  const base = target
    ? { id: target.id, title: target.title, date: target.date || '', url: target.url || '' }
    : { title: '', date: today(), url: '' };
  view = { name: 'edit', id: target?.id, draft: { ...base, title: c.title && !target?.sentences.length && !hasAudio(target) ? c.title : base.title || c.title,
    url: c.url || base.url, raw: c.raw, rows: rows.length ? rows : target ? target.sentences.map(s => ({ ...s })) : [] } };
  render();
  toast(!rows.length ? '英文が見つかりませんでした。貼り付けた内容を確認してください'
    : hasDialogue(c.raw) ? `DIALOGUE から${rows.length}文を取り出しました。確認して保存してください`
    : `⚠ DIALOGUE の見出しが見つからないため、ページ全体から${rows.length}文を取り出しました。不要な行を消してください`);
}
// クリップボードを直接読めないときの貼り付け枠(長押し →「ペースト」で、そのまま取り込む)
function openPasteSheet(targetId) {
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="sheet-bg"></div>
    <div class="sheet" role="dialog" aria-label="貼り付け">
      <h2>📋 ここに貼り付けてください</h2>
      <p class="hint">下の枠を<b>長押し</b>して「<b>ペースト</b>」を選ぶと、そのまま取り込みます。</p>
      <textarea class="pastebox" rows="4" placeholder="ここを長押し →「ペースト」"></textarea>
      <button class="ghost" data-x>やめる</button>
    </div>`;
  document.body.append(wrap);
  const ta = wrap.querySelector('textarea'), close = () => wrap.remove();
  wrap.querySelector('.sheet-bg').onclick = close;
  wrap.querySelector('[data-x]').onclick = close;
  let done = false;
  const go = t => { if (done || !t.trim()) return; done = true; close(); handleClipText(t, targetId); };
  ta.addEventListener('paste', e => { const t = e.clipboardData?.getData('text/plain') || ''; if (t) { e.preventDefault(); go(t); } });
  ta.addEventListener('input', () => { if (ta.value.length > 30) go(ta.value); });
  setTimeout(() => ta.focus(), 150);
}

// ================================================================ まとめて取り込み・音声の割り当て
async function importBundle(clips) {
  let made = 0, updated = 0, skipped = 0, withJa = 0;
  for (const c of clips) {
    const rows = parseScript(c.raw);
    if (!rows.length) { skipped++; continue; }
    if (rows.some(r => r.ja)) withJa++;
    let L = c.url && Store.lessons.find(x => x.url === c.url);
    if (L) { // 同じ記事を取り込み直したときは台本だけ更新(文の数が同じなら区切りも残す)
      if (L.sentences.length === rows.length) rows.forEach((r, i) => { if (L.sentences[i].seg) r.seg = L.sentences[i].seg; });
      L.sentences = rows; updated++;
    } else {
      L = { id: uid(), title: c.title || '無題', date: dateFromTitle(c.title), url: c.url, createdAt: Date.now() + made, history: [], sentences: rows };
      Store.lessons.push(L); made++;
    }
    await autoSplitIfNeeded(L);
  }
  await Store.save();
  view = { name: 'home' }; render();
  toast(`${made}件を作成${updated ? `・${updated}件を更新` : ''}(訳あり ${withJa}件)${skipped ? `。英文が見つからない記事 ${skipped}件` : ''}。次に「音声をまとめて割り当て」で音声を付けてください`);
}

  render();
}

copy.onclick=async()=>{ta.value=txt;ta.style.display='block';ta.readOnly=true;ta.focus();ta.setSelectionRange(0,txt.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}if(ok)return done();try{await navigator.clipboard.writeText(txt);done();}catch(e){ta.select();copy.textContent='下の文字を全選択してコピーしてください';}};
box.append(mk('div','Shadowing Coach に送る','font-weight:700'),copy);
const creator=location.hostname==='note.com'&&location.pathname.split('/')[1];
if(creator){
const IN='width:100%;margin-top:6px;padding:8px;font-size:16px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;background:#fff;color:#111;-webkit-text-fill-color:#111;color-scheme:light;opacity:1';
const from=mk('input','',IN);from.type='date';const to=mk('input','',IN);to.type='date';
const kw=mk('input','',IN);kw.value='ラジオ英会話';
const go=mk('button','この人の記事を期間でまとめて取得','display:block;width:100%;margin-top:8px;padding:10px;border:1px solid #2f6fde;border-radius:10px;background:#fff;color:#2f6fde;font:600 15px '+F);
go.onclick=async()=>{
if(!from.value||!to.value){msg.textContent='開始日と終了日を選んでください';return;}
go.disabled=true;const list=[];let olderPages=0;
try{
for(let p=1;p<=200;p++){
const j=await(await fetch('/api/v2/creators/'+creator+'/contents?kind=note&page='+p)).json();
const c=(j.data&&j.data.contents)||[];let older=false;
for(const n of c){const m=(n.name||'').match(/(\\d{4})年(\\d{1,2})月(\\d{1,2})日/);const d=m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):String(n.publishAt||'').slice(0,10);
if(d<from.value)older=true;
if(d>=from.value&&d<=to.value&&(!kw.value||(n.name||'').includes(kw.value)))list.push({key:n.key,name:n.name,d:d});}
msg.textContent='記事を探しています… '+p+'ページ目('+list.length+'件)';
if(older&&++olderPages>=2)break;
if(!c.length||(j.data&&j.data.isLastPage))break;}
list.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
const parts=[];
for(let i=0;i<list.length;i++){msg.textContent='本文を取得しています… '+(i+1)+'/'+list.length;
const j=await(await fetch('/api/v3/notes/'+list[i].key)).json();
parts.push(one(list[i].name,'https://note.com/'+creator+'/n/'+list[i].key,toText((j.data&&j.data.body)||'')));
await new Promise(r=>setTimeout(r,300));}
if(!parts.length){msg.textContent='該当する記事がありませんでした';go.disabled=false;return;}
txt=HEAD+'まとめ\\n'+parts.join('\\n=====\\n');
msg.textContent=parts.length+'件の記事を取得しました。上のボタンでコピーしてください';
copy.textContent='まとめてコピー('+parts.length+'件)';
}catch(e){msg.textContent='取得できませんでした: '+e.message;go.disabled=false;}};
box.append(mk('div','期間でまとめて取得(note)','font-weight:600;margin-top:12px'),mk('div','開始日','font-size:12px;color:#555;margin-top:6px'),from,mk('div','終了日','font-size:12px;color:#555;margin-top:6px'),to,mk('div','タイトルに含む文字','font-size:12px;color:#555;margin-top:6px'),kw,go);}
const x=mk('button','閉じる','display:block;width:100%;margin-top:6px;padding:8px;border:0;background:none;color:#2f6fde;font:15px '+F);
x.onclick=()=>box.remove();
box.append(msg,ta,x);document.body.append(box);
})()`.replace(/\n/g, ''));

// ================================================================ backup
async function exportBackup() {
  const name = `shadowing-backup-${today()}.json`;
  const blob = new Blob([JSON.stringify({ app: 'shadowing-coach', version: 1, exportedAt: new Date().toISOString(), lessons: Store.lessons, stats: Stats.days }, null, 1)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) { // iPhone: 共有シートから「ファイルに保存」など
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function restoreBackup(file) {
  let lessons, stats;
  try { const data = JSON.parse(await file.text()); lessons = Array.isArray(data) ? data : data.lessons; stats = data.stats; } catch {}
  if (!Array.isArray(lessons)) return toast('バックアップファイルを読み込めませんでした');
  if (!confirm(`${lessons.length}件のレッスンを復元します。同じレッスンは上書きされます。よろしいですか？`)) return;
  for (const L of lessons) {
    if (!L?.id || !Array.isArray(L.sentences)) continue;
    if (L.audio) { if (await idb.get('audio:' + L.id).catch(() => null)) delete L.audio.missing; else L.audio.missing = true; }
    const i = Store.lessons.findIndex(x => x.id === L.id);
    if (i >= 0) Store.lessons[i] = L; else Store.lessons.push(L);
  }
  for (const [d, r] of Object.entries(stats || {})) { // 練習記録は日ごとに多い方を残す
    const cur = Stats.days[d];
    Stats.days[d] = { sec: Math.max(cur?.sec || 0, r.sec || 0), runs: Math.max(cur?.runs || 0, r.runs || 0) };
  }
  await Stats.save(); await Store.save();
  view = { name: 'home' }; render(); toast('復元しました');
}

(async () => {
  await Store.load();
  await Stats.load();
  let changed = false;
  for (const L of Store.lessons) {
    if (!L.audio) continue;
    const has = !!(await idb.get('audio:' + L.id).catch(() => null));
    if (!!L.audio.missing === has) { if (has) delete L.audio.missing; else L.audio.missing = true; changed = true; }
    if (await autoSplitIfNeeded(L)) changed = true;
  }
  if (changed) await Store.save();
  render();
  // オフラインでも開けるようにする(https か localhost のときだけ動く)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
